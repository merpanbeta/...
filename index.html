  html, body {
    height: 100%;
    overflow-x: hidden;

  body {
    background: #000;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    width: 100%; height: 100%;

    z-index: -2;

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);

    pointer-events: none;

  #crt {
    position: fixed;
    inset: 0;
    pointer-events: none;

    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.18) 0 1px,
      transparent 1px 3px

    mix-blend-mode: multiply;
  }

  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 51;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
  }

  p {
    margin-bottom: 28px;
    word-break: break-word;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  .cloud {
    cursor: pointer;
    user-select: none;
    transition: opacity 0.15s;
  }
  .cloud:active {
    opacity: 0.5;
  }

  #secret {
    display: none;
    margin-top: 10px;
    letter-spacing: 1px;
  }
  #secret.show {
    display: block;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.88; }
    94% { opacity: 1; }
    96% { opacity: 0.94; }
    97% { opacity: 1; }
