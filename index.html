<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSIP_07</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow-x: hidden;
  }
  body {
    background: #000;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    padding: 40px 20px;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    animation: flicker 8s infinite;
  }

  /* Video background full screen, loop */
  #bg-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -2;
    opacity: 0.65;
    filter: brightness(0.65) contrast(1.2);
  }

  /* Overlay gelap biar teks tetap terbaca */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: -1;
    pointer-events: none;
  }

  /* CRT scanlines */
  #crt {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.18) 0 1px,
      transparent 1px 3px
    );
    mix-blend-mode: multiply;
  }

  /* Vignette */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 51;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
  }

  p {
    margin-bottom: 28px;
    word-break: break-word;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.88; }
    94% { opacity: 1; }
    96% { opacity: 0.94; }
    97% { opacity: 1; }
  }
</style>
</head>
<body>

<!-- VIDEO BACKGROUND -->
<video id="bg-video" autoplay muted loop playsinline>
  <source src="122901.mp4" type="video/mp4">
</video>
<div id="overlay"></div>
<div id="crt"></div>
<div id="vignette"></div>

<!-- TEKS (dari file yang kamu kirim) -->
<p>= ᛦᚤᚢ᛬ᚾᛄᚢᛄᚱ᛬ᚴᚾᚤᚢ᛬ᚢᚼᚷᛏ᛬ᚢᛁᛚᛚ᛬ᚴᚤᛘᛄ᛬᛬ᛁ'ᛘ᛬ᛁᚢᛋᛏ᛬ᚤᚾᛚᛦ᛬ᚹᛁᚢᛄ᛬ᛦᚤᚢ᛬ᚷ᛬ᚼᛁᚾᛏ᛬ᛁᚠ᛬ᛦᚤᚢ᛬ᚢᚷᚾᛏ᛬ᛏᚤ᛬ᚠᛁᚾᚦ᛬ᚢᚼᚷᛏ᛬ᛁ᛬ᚴᚼᚷᛋᛄ</p>

<p>🌧☐☐☐☐__☐   🌧☐☐_☐☐☐☐   🌧☐☐☐_☐_☐   🌧☐☐☐_☐_🌧   🌧☐☐☐_☐_☐   🌧☐☐___☐🌧   🌧☐☐__☐_☐   🌧_☐____🌧   🌧_☐☐☐__☐   🌧_☐____🌧   🌧☐☐☐☐__☐   🌧☐☐_☐☐☐☐   🌧☐☐☐_☐_☐   🌧☐☐☐_☐_🌧   🌧☐☐☐_☐_☐   🌧☐☐___☐🌧   🌧☐☐__☐_☐</p>

<script>
  // ===== MUSIK: auto play + loop + susah dimatikan =====
  const bgm = new Audio('Maebi_-_Trauma_(mp3.pm).mp3');
  bgm.loop = true;
  bgm.volume = 0.55;

  function forcePlay() {
    bgm.play().catch(() => {});
  }

  // Coba play segera
  forcePlay();

  // Paksa play lagi setiap kali user klik / touch / tekan tombol
  ['click', 'touchstart', 'keydown', 'mousemove'].forEach(evt => {
    document.addEventListener(evt, forcePlay, { passive: true });
  });

  // Kalau musik sempat di-pause, langsung play lagi
  bgm.addEventListener('pause', () => {
    setTimeout(forcePlay, 50);
  });

  // Jaga-jaga: cek tiap 2 detik, kalau tidak playing → play lagi
  setInterval(() => {
    if (bgm.paused) forcePlay();
  }, 2000);

  // ===== Proteksi dasar =====
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I','J','C','i','j','c'].includes(e.key)) ||
      (e.ctrlKey && ['u','U','s','S'].includes(e.key))
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>

</body>
</html>
