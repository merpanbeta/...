<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSIP_07</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#0a0a0a; color:#c8c8c8;
    font-family:"Courier New", Courier, monospace;
    font-size:15px; line-height:1.7;
    padding:40px 20px; max-width:720px; margin:0 auto;
    animation:flicker 7s infinite;
  }
  @keyframes flicker {
    0%,100% { opacity:1; } 92% { opacity:1; }
    93% { opacity:.86; } 94% { opacity:1; } 96% { opacity:.93; } 97% { opacity:1; }
  }
  h1,h2 { color:#e0e0e0; font-weight:normal; margin-bottom:20px; letter-spacing:1px; }
  h1 { font-size:18px; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:30px; }
  h2 { font-size:16px; margin-top:50px; color:#aaa; }
  p { margin-bottom:16px; }
  .meta { color:#666; font-size:13px; margin-bottom:30px; }
  .warning { color:#b0b0b0; border-left:2px solid #444; padding-left:15px; margin:25px 0; }
  .section { margin-bottom:60px; }
  .footer { margin-top:80px; padding-top:20px; border-top:1px solid #222; color:#555; font-size:13px; }

  #crt { position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:51;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%); }

  .secret { cursor:pointer; user-select:none; }
  #datalost { color:#666; }
  #datalost.revealed { color:#c8c8c8; }
  .hidden-msg { display:none; color:#8a8a8a; font-style:italic; }
  .glitch { animation:gl 2.5s infinite steps(1); }
  @keyframes gl {
    0%,90%,100% { text-shadow:none; transform:none; }
    91% { text-shadow:2px 0 #f00, -2px 0 #0ff; transform:translateX(2px); }
    93% { text-shadow:-2px 0 #f00, 2px 0 #0ff; transform:translateX(-2px); }
    95% { text-shadow:none; transform:none; }
  }

  #terminal { display:none; margin:30px 0; border:1px solid #333; padding:18px; background:#050505; }
  #terminal input { width:100%; background:#000; border:1px solid #444; color:#c8c8c8;
    font-family:inherit; font-size:15px; padding:10px; letter-spacing:2px; }
  #terminal input:focus { outline:none; border-color:#777; }
  #termOut { margin-top:12px; color:#888; min-height:20px; }

  #final { display:none; }
  #final.show { display:block; animation:fadein 2.5s; }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }

  #progress { letter-spacing:3px; color:#555; }
  #static { position:fixed; inset:0; background:#000; z-index:100; display:none;
    align-items:center; justify-content:center; color:#333; font-size:13px; }
</style>
</head>
<body>

<div id="crt"></div>
<div id="vignette"></div>
<div id="static">[ S I G N A L &nbsp; L O S T ]</div>

<!-- ============================================================
     ⛔ DI BAWAH INI JANGAN DIUBAH — INI KODE TEKNIS ⛔
     Semua tulisan cerita ada di blok <script> di bawah,
     cari tulisan: ✏️ AREA EDIT
============================================================ -->

<div id="app"></div>

<script>
/* ==========================================================
   ✏️ AREA EDIT — HANYA BAGIAN INI YANG BOLEH KAMU UBAH ✏️
   ==========================================================
   ATURAN MAIN:
   1. Cuma ubah teks di DALAM tanda kutip "..."
   2. Jangan hapus koma (,) di akhir tiap baris
   3. Jangan hapus tanda kutipnya
   4. Kalau mau tulis petik di dalam teks, pakai petik miring ‘ ’
   5. Kalau websitenya error setelah edit: undo (Ctrl Z / tombol undo),
      biasanya ada kutip yang kehapus
   ========================================================== */

var CERITA = {

  judul: "ARSIP REKAMAN — UNIT 07",

  status: "TIDAK LENGKAP",
  klasifikasi: "INTERNAL",

  // ✏️ BAGIAN 01
  b1_judul: "BAGIAN 01 — PENDAHULUAN",
  b1_p1: "Dokumen ini disusun dari sisa-sisa rekaman yang ditemukan di ruang penyimpanan bawah tanah stasiun. Sebagian besar pita sudah rusak. Yang tersisa hanya potongan-potongan suara dan teks yang berhasil disalin.",
  b1_p2: "Tidak ada penjelasan resmi mengenai asal-usul rekaman. Hanya ada nomor urut dan tanggal yang tidak konsisten.",
  b1_warning: "Catatan: Beberapa bagian sengaja dibiarkan kosong. Jangan mencoba mengisi kekosongan tersebut.",

  // ✏️ BAGIAN 02
  b2_judul: "BAGIAN 02 — TRANSKRIP 14/03",
  b2_p1: "[00:01:12] Suara statis panjang. [00:01:47] Seorang pria berbicara dengan nada datar: ‘Ini bukan siaran. Ini hanya pengujian. Jika Anda mendengar ini, abaikan.’",
  b2_p2: "[00:02:03] Statis lagi. [00:02:31] Suara yang sama, lebih pelan: ‘Jangan lihat ke arah kamera. Kamera tidak menyala.’",
  b2_corrupt: "[00:03:08] [teks tidak terbaca]  [00:03:22] ‘…sudah terlalu lama di dalam…’",
  // ✏️ ini pesan rahasia yang muncul kalau pemain MENAHAN tulisan [teks tidak terbaca]
  b2_hidden: "// rekonstruksi: ‘MEREKA MENONTON DARI SISI LAIN LAYAR’",

  // ✏️ BAGIAN 03
  b3_judul: "BAGIAN 03 — CATATAN TEKNISI",
  b3_p1: "Saya diminta memeriksa pita nomor 07. Pita itu tidak seharusnya ada di rak.",
  b3_p2: "Saat diputar, gambar hanya menampilkan layar hitam selama 4 menit 12 detik. Setelah itu muncul teks putih di tengah layar. Saya tidak sempat mencatat isinya.",
  b3_p3: "Malam itu saya mendengar ketukan dari ruang arsip. Ketukan itu mengikuti pola yang sama dengan yang terdengar di dalam rekaman.",
  b3_p4: "Saya tidak akan membuka pintu itu lagi.",

  // ✏️ BAGIAN 04
  b4_judul: "BAGIAN 04 — FRAGMEN TERAKHIR",
  b4_p1: "‘Mereka bilang rekaman ini sudah dihapus.’",
  b4_p2: "‘Tapi yang dihapus hanya yang terlihat.’",
  b4_p3: "‘Yang tersisa… masih berbicara.’",
  b4_end: "[akhir berkas]",

  // ✏️ BAGIAN 05 — muncul setelah semua teka-teki selesai (ending)
  b5_judul: "BAGIAN 05 — YANG TIDAK SEHARUSNYA ADA",
  b5_p1: "…kamu membukanya.",
  b5_p2: "Rekaman 07 bukan rekaman. Itu pesan. Dan pesan itu butuh seseorang untuk membacanya sampai selesai.",
  b5_p3: "Ada satu pita lagi. Nomor 00.",
  b5_p4: "Isinya hanya 7 detik. Sebuah suara yang menyebut namamu.",
  b5_end: "[ARSIP_00 — tidak ditemukan. mungkin belum direkam.]",

  // ✏️ FOOTER
  foot1: "Dokumen ini disalin tanpa izin.",
  foot2: "Jika Anda menemukan salinan lain, jangan gabungkan.",

  /* ✏️ PENGATURAN TEKA-TEKI (angka boleh diubah) */
  teka1_jumlahKetukan: 7,        // berapa kali pemain harus ketuk [DATA HILANG]
  teka1_hasil: "[14/03 — 04:12]",// tulisan yang muncul setelah diketuk
  teka2_durasiTahan: 2000,       // berapa milidetik pemain harus menahan (2000 = 2 detik)
  teka3_kodePintu: "070412",     // ← KODE RAHASIA. ubah sesukamu!
  teka3_hintNomorPita: "07",     // clue: nomor pita
  teka3_hintDurasi: "0412",      // clue: durasi layar hitam (4 menit 12 detik)
};

/* ==========================================================
   ⛔ STOP. DI BAWAH INI KODE TEKNIS — JANGAN DIUBAH ⛔
   ========================================================== */

var state = { p1:false, p2:false, p3:false };
var app = document.getElementById('app');

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function P(text, cls){ return '<p class="'+(cls||'')+'">'+esc(text)+'</p>'; }

app.innerHTML =
  '<h1 class="glitch">'+esc(CERITA.judul)+'</h1>'
  + '<p class="meta">Status: '+esc(CERITA.status)+'<br>'
  + 'Tanggal akses terakhir: <span id="datalost" class="secret">[DATA HILANG]</span><br>'
  + 'Klasifikasi: '+esc(CERITA.klasifikasi)+'</p>'

  + '<div class="section"><h2>'+esc(CERITA.b1_judul)+'</h2>'
  + P(CERITA.b1_p1) + P(CERITA.b1_p2)
  + P(CERITA.b1_warning, 'warning secret') + '</div>'

  + '<div class="section"><h2>'+esc(CERITA.b2_judul)+'</h2>'
  + P(CERITA.b2_p1) + P(CERITA.b2_p2)
  + '<p class="secret" id="corrupt" style="color:#888">'+esc(CERITA.b2_corrupt)+'</p>'
  + '<p class="hidden-msg" id="msg2">'+esc(CERITA.b2_hidden)+'</p></div>'

  + '<div class="section"><h2>'+esc(CERITA.b3_judul)+'</h2>'
  + P(CERITA.b3_p1) + P(CERITA.b3_p2) + P(CERITA.b3_p3)
  + P(CERITA.b3_p4, 'warning') + '</div>'

  + '<div class="section"><h2>'+esc(CERITA.b4_judul)+'</h2>'
  + P(CERITA.b4_p1) + P(CERITA.b4_p2) + P(CERITA.b4_p3)
  + P(CERITA.b4_end) + '</div>'

  + '<div id="terminal">'
  + '<p style="color:#666;font-size:13px">&gt; AKSES DITOLAK. MASUKKAN KODE PINTU RUANG ARSIP.</p>'
  + '<p style="color:#555;font-size:12px">&gt; format: [nomor pita][durasi layar hitam, mmss]</p>'
  + '<input id="code" type="password" autocomplete="off" placeholder="_ _ _ _ _ _">'
  + '<p id="termOut"></p></div>'

  + '<div class="section" id="final"><h2 class="glitch">'+esc(CERITA.b5_judul)+'</h2>'
  + P(CERITA.b5_p1) + P(CERITA.b5_p2)
  + P(CERITA.b5_p3) + '<p><b style="color:#ddd">'+esc(CERITA.b5_p4)+'</b></p>'
  + P(CERITA.b5_end, 'hidden-msg')
  + '<p style="color:#666;font-size:12px;margin-top:30px">// akhir dari versi ini. lanjutkan ceritamu sendiri.</p></div>'

  + '<div class="footer"><p>'+esc(CERITA.foot1)+'<br>'
  + esc(CERITA.foot2).replace('jangan gabungkan','<span id="hintLink" class="secret">jangan gabungkan</span>')+'</p>'
  + '<p id="progress">██████░░░░</p></div>';

var progress = document.getElementById('progress');
function updateProgress(){
  var n = (state.p1?1:0)+(state.p2?1:0)+(state.p3?1:0);
  progress.textContent = '█'.repeat(2+n*2) + '░'.repeat(10-(2+n*2));
}

var ctx = null;
function audio(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
function playStatic(dur){
  var c = audio(); if(!c) return;
  var len = c.sampleRate * (dur||0.25);
  var buf = c.createBuffer(1, len, c.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = (Math.random()*2-1)*0.25;
  var src = c.createBufferSource(); src.buffer = buf;
  var g = c.createGain(); g.gain.value = 0.5;
  src.connect(g); g.connect(c.destination); src.start();
}
function knock(delay){
  var c = audio(); if(!c) return;
  setTimeout(function(){
    var o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 90; g.gain.value = 0.6;
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+0.15);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+0.16);
  }, delay);
}
function knockPattern(){ knock(0); knock(220); knock(440); knock(1100); knock(1500); }

function staticFlash(cb){
  var s = document.getElementById('static');
  s.style.display = 'flex';
  playStatic(0.5);
  setTimeout(function(){ s.style.display='none'; if(cb) cb(); }, 600);
}

/* --- Teka-teki 1: ketuk [DATA HILANG] --- */
var dl = document.getElementById('datalost'), taps = 0, tapTimer;
dl.addEventListener('click', function(){
  if(state.p1) return;
  taps++; playStatic(0.08);
  if(taps >= CERITA.teka1_jumlahKetukan){
    state.p1 = true;
    staticFlash(function(){
      dl.textContent = CERITA.teka1_hasil;
      dl.classList.add('revealed');
      knockPattern();
      checkUnlock();
    });
  } else {
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function(){ taps = 0; }, 1500);
  }
});

/* --- Teka-teki 2: tahan teks rusak --- */
var corrupt = document.getElementById('corrupt');
var pressTimer = null;
function startPress(){ pressTimer = setTimeout(function(){
  if(!state.p2){
    state.p2 = true;
    document.getElementById('msg2').style.display = 'block';
    playStatic(0.4); knockPattern(); checkUnlock();
  }
}, CERITA.teka2_durasiTahan); }
function endPress(){ clearTimeout(pressTimer); }
corrupt.addEventListener('touchstart', startPress, {passive:true});
corrupt.addEventListener('touchend', endPress);
corrupt.addEventListener('mousedown', startPress);
corrupt.addEventListener('mouseup', endPress);
corrupt.addEventListener('mouseleave', endPress);

/* --- terminal muncul setelah 2 petunjuk --- */
var terminalShown = false;
function checkUnlock(){
  updateProgress();
  if(state.p1 && state.p2 && !terminalShown){
    terminalShown = true;
    setTimeout(function(){
      document.getElementById('terminal').style.display = 'block';
      document.getElementById('terminal').scrollIntoView({behavior:'smooth'});
      knock(0); knock(300); knock(600);
    }, 1200);
  }
}

/* --- Teka-teki 3: kode pintu --- */
var codeInput = document.getElementById('code');
var termOut = document.getElementById('termOut');
codeInput.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  var val = codeInput.value.trim();
  if(val === CERITA.teka3_kodePintu){
    state.p3 = true; updateProgress();
    termOut.textContent = '> AKSES DIBERIKAN. MEMBUKA BAGIAN 05…';
    codeInput.disabled = true;
    setTimeout(function(){
      staticFlash(function(){
        document.getElementById('final').classList.add('show');
        knockPattern();
        document.getElementById('final').scrollIntoView({behavior:'smooth'});
      });
    }, 1500);
  } else {
    termOut.textContent = '> KODE SALAH. PINTU TERTUTUP LEBIH KENCANG.';
    playStatic(0.3);
    codeInput.value = '';
  }
});

/* --- petunjuk di footer --- */
document.getElementById('hintLink').addEventListener('click', function(){
  termOut.textContent = '> petunjuk: nomor pita = '+CERITA.teka3_hintNomorPita+'. durasi hitam = '+CERITA.teka3_hintDurasi+'. gabungkan.';
  if(terminalShown) document.getElementById('terminal').scrollIntoView({behavior:'smooth'});
});

updateProgress();
</script>

</body>
</html>
